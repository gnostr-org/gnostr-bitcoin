[package]
name = "gnostr-bitcoin"
version = "1910.922229.829806"
edition = "2024"

[lib]
name = "gnostr_bitcoin"
path = "src/lib.rs"

[dependencies]
rand = "0.9.2"
sha2 = "0.10.9"
ratatui = "0.26.1"
crossterm = "0.27.0"
anyhow = "1.0.86"
log = "0.4.21"
simplelog = "0.12.2"
dirs = "5.0.0"
ctrlc = { version = "3.4.4", features = ["termination"] }
time = { version = "0.3", features = ["macros", "formatting"] }
