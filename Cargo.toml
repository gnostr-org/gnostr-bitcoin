[package]
name = "gnostr-bitcoin"
version = "1910.922229.829806"
edition = "2024"

[lib]
name = "gnostr_bitcoin"
path = "src/lib.rs"

[[bin]]
name = "gnostr-bitcoin"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0.86"
crossterm = "0.27.0"
ctrlc = { version = "3.4.4", features = ["termination"] }
dirs = "5.0.0"
log = "0.4.21"
rand = "0.9.2"
ratatui = "0.26.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
simplelog = "0.12.2"
time = { version = "0.3", features = ["macros", "formatting"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
